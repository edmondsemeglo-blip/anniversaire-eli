<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyeux anniversaire 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --rouge: #8e1226;
    --rose: #f4b6c2;
    --creme: #fff8ee;
    --script: "Great Vibes", "Brush Script MT", cursive;
    --serif: "Playfair Display", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: repeating-linear-gradient(90deg, var(--rouge) 0 28px, var(--rose) 28px 56px);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); color: var(--rouge);
  }
  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .heart-float {
    position: fixed; bottom: -40px; font-size: 1.4rem; opacity: .8;
    animation: monte linear forwards; pointer-events: none; z-index: 1;
  }
  @keyframes monte { to { transform: translateY(-110vh) rotate(20deg); opacity: 0; } }

  .carte {
    position: relative; z-index: 2;
    width: min(92vw, 560px); min-height: 360px;
    background: var(--creme);
    border: 4px double var(--rouge); outline: 8px solid #fff; outline-offset: -2px;
    border-radius: 14px; padding: 48px 24px 28px;
    text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  }
  .coeur-or {
    position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
    font-size: 3.4rem; filter: drop-shadow(0 4px 4px rgba(0,0,0,.35));
    animation: bat 1.4s ease-in-out infinite;
  }
  @keyframes bat { 50% { transform: translateX(-50%) scale(1.12); } }

  .scene { display: none; flex-direction: column; align-items: center; gap: 18px; animation: apparait 1s ease both; }
  .scene.actif { display: flex; }
  @keyframes apparait { from { opacity: 0; transform: translateY(14px) scale(.96); } }

  .petit { font-size: 1.15rem; font-style: italic; }
  .gros  { font-family: var(--script); font-size: clamp(2.6rem, 11vw, 4.2rem); line-height: 1.05; }
  .gateau { font-size: 6rem; animation: flotte 2.4s ease-in-out infinite; }
  @keyframes flotte { 50% { transform: translateY(-8px); } }

  button {
    font-family: var(--serif); font-style: italic; font-size: 1rem;
    background: #fff; color: var(--rouge); border: 2px solid var(--rouge);
    border-radius: 999px; padding: 10px 22px; cursor: pointer; transition: .2s;
  }
  button:hover { background: var(--rouge); color: #fff; }

  .medaillon {
    width: 230px; height: 230px; border-radius: 50%;
    border: 6px solid #d9a441; overflow: hidden; background: var(--rose);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,.3);
  }
  .medaillon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .medaillon span { font-size: 5rem; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<main class="carte">
  <div class="coeur-or">❤️</div>

  <!-- 1 -->
  <section class="scene actif" id="s1">
    <p class="petit" id="t1"></p>
    <div class="gateau">🎂</div>
    <button id="btnSouffler">Souffler les bougies 🕯️</button>
  </section>

  <!-- 2 -->
  <section class="scene" id="s2">
    <p class="petit" id="t2"></p>
    <div class="gateau">✨🎂✨</div>
  </section>

  <!-- 3 -->
  <section class="scene" id="s3">
    <h1 class="gros">Joyeux<br>Anniversaire</h1>
    <p class="gros" id="prenom" style="font-size:2.4rem"></p>
  </section>

<script>
/* ============ À PERSONNALISER ============ */
const CONFIG = {
  prenom: "Mon ami",   // ← le prénom de ton ami
  texte1: "Ferme les yeux et fais un vœu…",
  texte2: "Ton souhait est en chemin…",
  message: "Joyeux anniversaire Eli ! Je te souhaite une magnifique journée entouré(e) de ceux que tu aimes et une année pleine de réussite, de bonheurs et de beaux projets. Profite bien de ta journée !",
  // La photo est déjà intégrée dans le fichier (balise <img id="photo">)
};
/* ========================================= */

const $ = id => document.getElementById(id);
$("t1").textContent = CONFIG.texte1;
$("t2").textContent = CONFIG.texte2;
$("prenom").textContent = "à toi, " + CONFIG.prenom + " 🎈";
$("message").textContent = CONFIG.message;

function montre(n) {
  document.querySelectorAll(".scene").forEach(s => s.classList.remove("actif"));
  $("s" + n).classList.add("actif");
}

/* --- Confettis --- */
const cv = $("confetti"), ctx = cv.getContext("2d");
let pieces = [], anim = null;
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", resize); resize();

function confettis(n = 160) {
  const couleurs = ["#8e1226", "#f4b6c2", "#d9a441", "#ffffff", "#e63b5a"];
  for (let i = 0; i < n; i++) pieces.push({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5,
    w: 6 + Math.random() * 7, h: 10 + Math.random() * 8,
    c: couleurs[Math.floor(Math.random() * couleurs.length)],
    vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2,
    r: Math.random() * 6, vr: -.15 + Math.random() * .3
  });
  if (!anim) boucle();
}
function boucle() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  pieces.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  });
  pieces = pieces.filter(p => p.y < cv.height + 30);
  anim = pieces.length ? requestAnimationFrame(boucle) : null;
  if (!anim) ctx.clearRect(0, 0, cv.width, cv.height);
}

/* --- Cœurs qui montent --- */
setInterval(() => {
  const h = document.createElement("div");
  h.className = "heart-float";
  h.textContent = ["💖", "💗", "❤️", "🎈"][Math.floor(Math.random() * 4)];
  h.style.left = Math.random() * 100 + "vw";
  h.style.animationDuration = 5 + Math.random() * 5 + "s";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 10500);
}, 600);

/* --- Séquence --- */
let timers = [];
function jouer() {
  timers.forEach(clearTimeout); timers = [];
  montre(1);
}
$("btnSouffler").onclick = () => {
  montre(2); confettis(80);
  timers.push(setTimeout(() => { montre(3); confettis(200); }, 3000));
  timers.push(setTimeout(() => { montre(4); confettis(120); }, 7000));
};
$("btnRejouer").onclick = jouer;
</script>
